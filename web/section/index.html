<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soil section</title>
<link rel="stylesheet" href="../fonts/inter.css">   <!-- Inter, bundled (Krishna, 11 Nov) -->
<!-- Soil section. Sits between the hook's last slide (red) and the collage.
     LAYOUT AND STYLE: Krishna's Figma board (file KJYIdATJ25L9HI84gAYZGR, 11 Nov 2026): positions, type, colours and the eight
     band images (img/board/, Krishna's greyscale edits of the ISRIC photos) are taken from the board; every text is placed at the
     board's frame coordinates. The well labels are hand-placed on the board, so they are listed per well below (LAB).
     DATA (read only, unchanged): wells_section.json, ../collage/water.json, ../../kit/data/area_outline.geojson. Wells, dots, the
     water tables and the band depths are drawn from the data; they match the board to within about 1 px. -->
<style>
  :root { --red:#c8102e; --ink:#000; --grey:#6b6b6b; }
  html, body { margin:0; height:100%; background:#fff; color:var(--ink); overflow:hidden;
               font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { opacity:0; transition:opacity .5s ease; }   /* fades in and out between acts, as the Prover */
  body.in { opacity:1; }
  #s { position:fixed; inset:0; width:100vw; height:100vh; display:block; overflow:visible; }
  /* the text layer: a 1920 x 1080 frame scaled and centred like the SVG, so every text sits at its board position */
  #f { position:fixed; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; pointer-events:none; }
  #f > div { position:absolute; line-height:normal; white-space:nowrap; }
  #f .wrap { white-space:normal; }
  /* intro (from the hook's flip): card, indicator, labels and key fade in last; outro: they fade first */
  .fade { transition:opacity .6s ease; }
  body.intro:not(.show) .fade { opacity:0; }
  body.outro .fade, body.outro #icons { opacity:0; transition:opacity .5s ease; }
  /* board type */
  .up { text-transform:uppercase; }
  .r13 { font-size:13px; } .b13 { font-size:13px; font-weight:700; } .b15 { font-size:15px; font-weight:700; }
  .g { color:var(--grey); }
  .kicker { color:var(--red); font-size:15px; font-weight:700; }
  .title { font-size:34px; font-weight:700; }
  .body { font-size:16px; text-transform:uppercase; }
  .source { color:var(--grey); font-size:12px; }
  .wnum { color:var(--red); font-size:52px; font-weight:700; font-variant-numeric:tabular-nums; }
  .wlab { color:var(--red); font-size:12px; font-weight:700; text-transform:uppercase; }
  .wsrc { color:var(--grey); font-size:11px; text-transform:uppercase; text-align:right; }
  .mat { color:#fff; font-size:13px; font-weight:500; font-style:italic; text-transform:uppercase; }
  /* the well labels (SVG, so they are revealed with their wells) */
  #s text { fill:#fff; font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif; text-transform:uppercase; }
  #s .yr { font-size:13px; font-variant-numeric:tabular-nums; }
  #s .nm { font-size:13px; font-weight:700; }
  #s .bk { font-size:12px; }
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="f"></div>

<script type="module">
import { SECTION, wellXs, WELL_ICON, frameToScreen } from "./geometry.js";
const { X0, X1, G } = SECTION;            // shared with the hook's flip (hook_tour/flip.js), so its outline lands on this ground line
const MAXD = 60, PX_PER_M = 659 / MAXD, PUMP = 9;   // board: 0-60 m over 659 px
// ?from=hook: arrived from the hook's flip. Start from the bare ground line (where the flip left it) and build the section:
// the layers wipe down, the wells drop in west to east, then the card, labels and key fade in (Krishna, 10 Nov).
const INTRO = new URLSearchParams(location.search).get("from") === "hook";
if (INTRO) {
  document.body.style.transition = "none"; document.body.classList.add("in", "intro");
  document.getElementById("s").innerHTML = `<line x1="${X0}" x2="${X1}" y1="${G}" y2="${G}" stroke="#000" stroke-width="${SECTION.GROUND_W}"/>`;
}
const RED = "#c8102e";
const get = async u => (await fetch(u)).json();
const [sec, water, area] = await Promise.all([get("wells_section.json"), get("../collage/water.json"), get("../../kit/data/area_outline.geojson")]);
const g = area.features[0].geometry, ring = g.type === "Polygon" ? g.coordinates.flat() : g.coordinates.flat(2);
const W = Math.min(...ring.map(p => p[0])), E = Math.max(...ring.map(p => p[0]));
const y = m => G + m * PX_PER_M, r = v => Math.round(v * 10) / 10;
const yr = Object.fromEntries(water.years.map(d => [d.y, d]));
const t85 = yr[1985], t23 = yr[2023], B = y(MAXD);
const base = (top, size) => r(top + 0.969 * size);   // board text boxes give the top; SVG text needs the baseline (Inter ascent)

// ---------- the text layer, at the board's frame coordinates ----------
const T = (x, top, cls, txt, extra = "") => `<div class="${cls}" style="left:${x}px;top:${top}px;${extra}">${txt}</div>`;
const R = (right, top, cls, txt) => `<div class="${cls}" style="right:${1920 - right}px;top:${top}px">${txt}</div>`;
let f = "";
// layers (board: Medium Italic 13, white, uppercase; top of each label as an offset from the top of its layer)
// ORDER AND DEPTHS after CGWB's lithological cross-sections (Aquifer Mapping reports, Barnala and Sangrur; Data_Verification/
// 14_lithology), simplified. Kankar "often intercepts" the sand (report text) but no depth is given: its band is schematic.
const LAYERS = [
  { from: 0,   to: 1.5, img: "soil-01-silt-dry",   label: "Topsoil: loamy sand", ly: 0 },
  { from: 1.5, to: 8,   img: "soil-02-clay-dry",   label: "Sandy clay", ly: 24.5 },
  { from: 8,   to: 20,  img: "soil-03-sand-dry",   label: "Fine to medium sand: the upper aquifer", ly: 55 },
  { from: 20,  to: 22,  img: "soil-04-kankar-dry", label: "Kankar (lime nodules)", ly: 0.3 },
  { from: 22,  to: 38,  img: "soil-05-sand-dry",   label: "" },
  { from: 38,  to: t23.m, img: "soil-06-clay-dry", label: "Clay", ly: 1.6 },
  { from: t23.m, to: 49, img: "soil-07-clay-wet",  label: "", noLine: true },   // the 2023 water table splits the clay (no white line)
  { from: 49,  to: MAXD, img: "soil-08-sand-wet",  label: "Sand: the aquifer below the clay", ly: 50 },
];
LAYERS.forEach(L => { if (L.label) f += T(112, r(y(L.from) + L.ly), "mat fade", L.label); });
// depth axis
for (let m = 0; m <= MAXD; m += 10) f += R(72, r(y(m) - 9), "r13 g up fade", `${m} m`);
f += T(102, 35, "r13 g up fade", `West · ${W.toFixed(2)}° E`) + R(1665, 35, "r13 g up fade", `East · ${E.toFixed(2)}° E`);
// right-hand labels
f += T(1685, 106, "r13 up fade", `Water table 1985: ${t85.m} m`)
   + T(1685, 153, "r13 up fade wrap", "≈ 8–10 m: surface pumps stop lifting water", "width:197px")
   + T(1688, 298, "b15 up fade", "Drained since 1985")
   + T(1688, 324, "r13 up fade wrap", `${r(t23.m - t85.m)} m of ground that was full of water, most of the upper sand aquifer`, "width:194px")
   + T(1685, 492, "b13 up fade", `Water table 2023: ${t23.m} m`)
   + T(1688, 565, "b15 up fade", "Saturated")
   + T(1688, 584, "r13 up fade wrap", "clay holds water but gives little; the sand below it is the aquifer", "width:194px")
   + T(1688, 662, "r13 up fade wrap", "The aquifer continues below:", "width:206px")
   + T(1688, 692, "r13 g up fade wrap", "CGWB's deepest wells here reach about 300 m", "width:194px");
// the card, bottom left (board: line breaks as Krishna set them)
f += T(104, 771, "kicker fade", "UNDER THE 11 BLOCKS · WEST TO EAST")
   + T(104, 793.3, "title fade", "FROM 6 M TO 40 M BELOW GROUND")
   + T(104, 849.5, "body fade", "Fifteen monitoring wells, at least one in every block, drawn on one line. Each drops to its first reading, then in red to its last. Below the water")
   + T(104, 872.6, "body fade", "table the ground is full of water, and its sand layers are the aquifer. Above it lies the ground the pumps have drained.")
   + T(104, 903.2, "source fade", "CGWB monitoring wells via India Data Portal; pre-monsoon depth to water. Water table = belt median, 3-year rolling (1985: 3 wells; 2023: 14). Wells chosen by rule: the longest record in")
   + T(104, 920, "source fade", "each block, plus wells read for 18+ years. Layers: CGWB aquifer mapping, Barnala and Sangrur districts (simplified).");
// the water table, bottom right
f += T(1699.3, 966.1, "wnum fade", `${t23.m.toFixed(1)} m`)
   + T(1687.5, 1022.1, "wlab fade", "Water below ground · 2023")
   + T(1605.1, 1037, "wsrc fade wrap", "Median of the belt's CGWB monitoring wells, pre-monsoon", "width:268px");
// key text
f += T(101.5, 999.5, "r13 g up fade", "First reading") + T(101.5, 1021.5, "r13 g up fade", "Last reading. Red = how far the water fell at that well");
const frame = document.getElementById("f"); frame.innerHTML = f;
const place = () => { const F = frameToScreen(); frame.style.transform = `translate(${F.x(0)}px, ${F.y(0)}px) scale(${F.s})`; };
place(); addEventListener("resize", place);

// ---------- the drawing ----------
let h = "", bands = "";
LAYERS.forEach(L => {
  const y0 = y(L.from), y1 = y(L.to);
  bands += `<image href="img/board/${L.img}.png" x="${X0}" y="${r(y0)}" width="${X1 - X0}" height="${r(y1 - y0)}" preserveAspectRatio="none"/>`;
  if (!L.noLine) bands += `<line x1="${X0}" x2="${X1}" y1="${r(y0)}" y2="${r(y0)}" stroke="#fff" stroke-width="1"/>`;
});
h += `<defs><clipPath id="wipe"><rect id="wipeR" x="0" y="${G}" width="1920" height="${B - G + 2}" data-h="${B - G + 2}"/></clipPath></defs>
      <g id="gBands" clip-path="url(#wipe)">${bands}</g><g class="fade">`;
// depth axis: ticks and the vertical line (board: x 78-88, line at 82.5)
for (let m = 0; m <= MAXD; m += 10) h += `<line x1="78" x2="88" y1="${r(y(m))}" y2="${r(y(m))}" stroke="#000"/>`;
h += `<line x1="82.5" x2="82.5" y1="${G}" y2="${r(B)}" stroke="#000"/>`;
// pump limit (dotted), 1985 water table (dashed black), 2023 water table (dashed white, 2 px)
h += `<line x1="${X0}" x2="${X1}" y1="${r(y(PUMP))}" y2="${r(y(PUMP))}" stroke="#000" stroke-dasharray="2 4"/>
      <line x1="${X0}" x2="${X1}" y1="${r(y(t85.m))}" y2="${r(y(t85.m))}" stroke="#000" stroke-dasharray="8 6"/>
      <line x1="${X0}" x2="${X1}" y1="${r(y(t23.m))}" y2="${r(y(t23.m))}" stroke="#fff" stroke-width="2" stroke-dasharray="4 4"/></g>`;
// the 15 wells. Labels hand-placed on Krishna's board, in frame px, west to east (the same order as wells_section.json):
// name [text, centre x, top], block [text or null, centre x, top], first year [x, top], last year [x, top].
const LAB = [
  [["Tappa", 321, 533], ["Sehna", 320.5, 549], [332, 181], [330, 510]],
  [["Barnala", 523.5, 573], null, [532, 155], [530, 550]],
  [["Mahal Kalan", 594.5, 504], null, [602, 345], [602, 478]],
  [["Dhanaula", 664.5, 305], ["Barnala", 664.5, 321], [676, 121], [673, 279]],
  [["Badbar", 764, 288], ["Barnala", 763, 304], [773, 100], [772, 266]],
  [["Bugra", 833.5, 504], ["Sangrur", 834, 520], [845, 157], [843, 481]],
  [["Ghanauri Kalan", 905, 555], ["Sher Pur", 906, 587], [914, 473], [914, 532]],
  [["Chural Kalan", 976.5, 451], ["Lehra Gaga", 978, 485], [987, 121], [984, 428]],
  [["Sunam", 1047, 524], ["Sunam", 1046.5, 540], [1056, 438], [1056, 502]],
  [["Haryao", 1118, 360], ["Andana", 1117.5, 376], [1126, 114], [1126, 337]],
  [["Bhojowali", 1189, 557], ["Dhuri", 1189, 573], [1197, 379], [1197, 535]],
  [["Kheri Naran", 1259.5, 487], ["Dirba", 1261, 503], [1268, 438], [1268, 464]],
  [["Mandevi", 1331, 505], ["Andana", 1330.5, 521], [1342, 149], [1339, 476]],
  [["Akbar Pur", 1402.5, 383], ["Bhawanigarh", 1403, 399], [1412, 184], [1412, 362]],
  [["Bhulan", 1475, 187], ["Andana", 1474.5, 203], [1485, 101], [1482, 166]],
];
const XS = wellXs(sec.wells, W, E), ws = sec.wells.map((w, i) => ({ ...w, X: XS[i] }));   // shared with the flip
const icons = ws.map(w => `<circle cx="${r(w.X)}" cy="${G}" r="${WELL_ICON.r}" fill="#fff" stroke="#000" stroke-width="${WELL_ICON.stroke}"/>`).join("");
let wellClips = "";
ws.forEach((w, i) => {
  const [nm, bk, a, b] = LAB[i], xx = r(w.X), ya = r(y(w.d0)), yb = r(y(w.d1));
  const low = Math.max(yb + 8, nm[2] + 17, bk ? bk[2] + 16 : 0), full = r(low - G + 4);   // each well is revealed by a clip that grows down
  wellClips += `<clipPath id="wc${i}"><rect class="wcr" x="${xx - 90}" y="${G - 1}" width="180" height="${full}" data-h="${full}"/></clipPath>`;
  h += `<g class="well" clip-path="url(#wc${i})"><title>${w.name} (${w.block}): ${w.d0} m in ${w.y0}, ${w.d1} m in ${w.y1} (${w.n} pre-monsoon readings)</title>
        <line x1="${xx}" x2="${xx}" y1="${G}" y2="${ya}" stroke="#fff" stroke-width="5"/>
        <line x1="${xx}" x2="${xx}" y1="${ya}" y2="${yb}" stroke="${RED}" stroke-width="5"/>
        <circle cx="${xx}" cy="${ya}" r="5.5" fill="#fff" stroke="${RED}" stroke-width="2"/>
        <circle cx="${xx}" cy="${yb}" r="6.5" fill="${RED}"/>
        <text x="${a[0]}" y="${base(a[1], 13)}" class="yr">${w.y0}</text>
        <text x="${b[0]}" y="${base(b[1], 13)}" class="yr">${w.y1}</text>
        <text x="${nm[1]}" y="${base(nm[2], 13)}" class="nm" text-anchor="middle">${nm[0]}</text>
        ${bk ? `<text x="${bk[1]}" y="${base(bk[2], 12)}" class="bk" text-anchor="middle">${bk[0]}</text>` : ""}</g>`;
});
h += `<defs>${wellClips}</defs>`;
// ground line (and its stub to the axis), well icons, key
h += `<line id="ground" x1="${X0}" x2="${X1}" y1="${G}" y2="${G}" stroke="#000" stroke-width="${SECTION.GROUND_W}"/><g id="icons">${icons}</g>
      <g class="fade"><line x1="82" x2="${X0}" y1="${G}" y2="${G}" stroke="#000" stroke-width="${SECTION.GROUND_W}"/>
      <line x1="83.5" x2="83.5" y1="988" y2="1008" stroke="#000" stroke-width="2"/><line x1="83.5" x2="83.5" y1="1008" y2="1030" stroke="${RED}" stroke-width="3"/>
      <circle cx="83.5" cy="1008" r="4.5" fill="#fff" stroke="${RED}" stroke-width="2"/><circle cx="83.5" cy="1030" r="5.5" fill="${RED}"/></g>`;

const svg = document.getElementById("s");
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const tween = (ms, fn) => new Promise(done => { const t0 = performance.now();
  const k = now => { const t = Math.min(1, (now - t0) / ms); fn(ease(t)); if (t < 1) requestAnimationFrame(k); else done(); }; requestAnimationFrame(k); });
if (INTRO) {
  // the well icons arrived with the flip: show them on the line straight away
  svg.innerHTML = `<line x1="${X0}" x2="${X1}" y1="${G}" y2="${G}" stroke="#000" stroke-width="${SECTION.GROUND_W}"/>${icons}`;
  // load the band images before the build starts, so the wipe shows soil, not blanks (at most 1.5 s)
  await Promise.race([Promise.all(LAYERS.map(L => { const im = new Image(); im.src = `img/board/${L.img}.png`; return im.decode().catch(() => {}); })),
                      new Promise(res => setTimeout(res, 1500))]);
  svg.innerHTML = h;
  const wipe = svg.querySelector("#wipeR"), rects = [...svg.querySelectorAll(".wcr")];
  [wipe, ...rects].forEach(el => el.setAttribute("height", 0));
  await tween(1500, e => wipe.setAttribute("height", e * +wipe.dataset.h));                         // layers wipe down
  await Promise.all(rects.map((el, i) => new Promise(res => setTimeout(() =>                     // wells drop, west to east
    tween(600, e => el.setAttribute("height", e * +el.dataset.h)).then(res), i * 130))));
  document.body.classList.add("show");                                                           // card, labels, key
} else {
  svg.innerHTML = h;
  requestAnimationFrame(() => document.body.classList.add("in"));
}
document.title = "Soil section";
// → (or PageDown / Space) runs the outro into the collage; ← goes back to the hook's last slide
let leaving = false;
addEventListener("keydown", e => {
  const next = ["ArrowRight", "PageDown", " "].includes(e.key), back = ["ArrowLeft", "PageUp"].includes(e.key);
  if (leaving || !(next || back)) return;
  e.preventDefault(); leaving = true;
  if (next) { toCollage(); return; }
  document.body.style.transition = ""; document.body.classList.remove("in");
  setTimeout(() => { location.href = "../hook_tour/index.html?step=6"; }, 500);
});
// -> into the collage (Krishna, 11 Nov): the build runs backwards (labels fade, wells rise back into the ground line east to west,
// the layers wipe up), so only the ground line is left; it then slides down to the collage's through line (y 913 of the frame),
// stretches to the screen's edges and thins to its weight, and the collage opens on that same line (?from=section).
async function toCollage() {
  const body = document.body, ground = svg.querySelector("#ground");
  body.classList.add("outro");
  const rects = [...svg.querySelectorAll(".wcr")].reverse(), wipe = svg.querySelector("#wipeR");
  await Promise.all(rects.map((el, i) => new Promise(res => setTimeout(() => {
    const h0 = +el.getAttribute("height"); tween(500, e => el.setAttribute("height", h0 * (1 - e))).then(res); }, i * 70))));
  if (wipe) { const h0 = +wipe.getAttribute("height"); await tween(1100, e => wipe.setAttribute("height", h0 * (1 - e))); }
  const F = frameToScreen(), L = -F.x(0) / F.s - 4, Rr = (innerWidth - F.x(0)) / F.s + 4;   // the screen's edges, in frame px
  const W0 = SECTION.GROUND_W, W1 = Math.max(1 / F.s, 1.5);                                 // the collage line: max(1 px, 1.5 frame px)
  await tween(1300, e => { ground.setAttribute("x1", X0 + (L - X0) * e); ground.setAttribute("x2", X1 + (Rr - X1) * e);
    const yy = G + (913 - G) * e; ground.setAttribute("y1", yy); ground.setAttribute("y2", yy); ground.setAttribute("stroke-width", W0 + (W1 - W0) * e); });
  location.href = "../collage/index.html?from=section";
}
</script>
</body>
</html>
