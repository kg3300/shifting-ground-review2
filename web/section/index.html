<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soil section</title>
<!-- Soil section, plain draft (10 Nov 2026), for Krishna to style in Figma. Sits between the hook's last slide (red) and the collage.
     Every CGWB monitoring well in the 11 blocks on one drawing: x = the well's longitude across the study area (west to east),
     so when the hook's outline flips about a horizontal axis each well keeps its x; y = depth to water below ground.
     Data (read only): ../hook_tour/data/wells_monitoring.geojson (58 wells, latest reading 2013-21),
     ../hook_tour/data/wells_long.geojson (9 long-record wells, first and latest reading), ../collage/water.json (belt median by year),
     ../../kit/data/area_outline.geojson (the study-area outline, for the west and east ends). -->
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  svg { display: block; width: 100vw; height: 100vh; font-family: Arial, Helvetica, sans-serif; }
  text { fill: #000; }
  .small { font-size: 16px; } .label { font-size: 20px; } .kicker { font-size: 18px; letter-spacing: .12em; }
  .grey { fill: #777; }
</style>
</head>
<body>
<svg id="s" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
<script type="module">
const X0 = 200, X1 = 1720, G = 300, PX_PER_M = 10, MAXD = 50;      // ground line from X0 to X1 at y = G; 1 m = 10 px
const get = async u => (await fetch(u)).json();
const [mon, long, water, area] = await Promise.all([get("../hook_tour/data/wells_monitoring.geojson"), get("../hook_tour/data/wells_long.geojson"),
                                                    get("../collage/water.json"), get("../../kit/data/area_outline.geojson")]);
const g = area.features[0].geometry, ring = g.type === "Polygon" ? g.coordinates.flat() : g.coordinates.flat(2);
const W = Math.min(...ring.map(p => p[0])), E = Math.max(...ring.map(p => p[0]));
const x = lon => X0 + (lon - W) / (E - W) * (X1 - X0), y = m => G + m * PX_PER_M, r = v => Math.round(v * 10) / 10;
const yr = Object.fromEntries(water.years.map(d => [d.y, d]));
const t85 = yr[1985], t23 = yr[2023];

let h = "";
// title
h += `<text x="60" y="70" class="kicker">SECTION · SANGRUR–BARNALA, WEST TO EAST</text>
      <text x="60" y="100" class="small grey">Plain draft. Every monitoring well in the 11 blocks on one line; each drops to its depth to water.</text>`;
// depth axis
for (let m = 0; m <= MAXD; m += 10) h += `<line x1="${X0 - 40}" x2="${X0 - 30}" y1="${y(m)}" y2="${y(m)}" stroke="#000"/><text x="${X0 - 50}" y="${y(m) + 6}" class="small" text-anchor="end">${m} m</text>`;
h += `<line x1="${X0 - 35}" x2="${X0 - 35}" y1="${G}" y2="${y(MAXD)}" stroke="#000"/>`;
// belt median water table, 1985 and 2023 (the same series as the collage's red indicator)
h += `<line x1="${X0}" x2="${X1}" y1="${y(t85.m)}" y2="${y(t85.m)}" stroke="#000" stroke-dasharray="8 6"/>
      <text x="${X1 + 12}" y="${y(t85.m) + 6}" class="small">1985: ${t85.m} m</text>
      <line x1="${X0}" x2="${X1}" y1="${y(t23.m)}" y2="${y(t23.m)}" stroke="#000" stroke-width="2"/>
      <text x="${X1 + 12}" y="${y(t23.m) + 6}" class="small">2023: ${t23.m} m</text>
      <text x="${X1 + 12}" y="${(y(t85.m) + y(t23.m)) / 2 + 6}" class="small grey">${r(t23.m - t85.m)} m lower</text>`;
// monitoring wells: ground to latest depth
for (const f of mon.features) {
  const p = f.properties, xx = r(x(f.geometry.coordinates[0])), d = +p.last_depth_m;
  h += `<line x1="${xx}" x2="${xx}" y1="${G}" y2="${r(y(d))}" stroke="#000" stroke-width="1.5" stroke-opacity="0.55"><title>${p.station_name} (${p.block}): ${d} m, ${p.last_date.slice(0, 4)}</title></line>`;
}
// long-record wells: solid to the first reading, dashed on to the latest (as the hook's ticks)
for (const f of long.features) {
  const p = f.properties, xx = r(x(f.geometry.coordinates[0])), a = +p.first_depth_m, b = +p.last_depth_m;
  h += `<g><title>${p.name} (${p.block}): ${a} m in ${p.first_year}, ${b} m in ${p.last_year}</title>
        <line x1="${xx}" x2="${xx}" y1="${G}" y2="${r(y(a))}" stroke="#000" stroke-width="4"/>
        <line x1="${xx}" x2="${xx}" y1="${r(y(a))}" y2="${r(y(b))}" stroke="#000" stroke-width="4" stroke-dasharray="6 5"/></g>`;
}
// ground line (drawn last, on top) and its ends
h += `<line id="ground" x1="${X0}" x2="${X1}" y1="${G}" y2="${G}" stroke="#000" stroke-width="3"/>
      <text x="${X0}" y="${G - 16}" class="small">West ${W.toFixed(2)}° E</text><text x="${X1}" y="${G - 16}" class="small" text-anchor="end">East ${E.toFixed(2)}° E</text>`;
// key and source
const ky = 900;
h += `<line x1="60" x2="60" y1="${ky}" y2="${ky + 30}" stroke="#000" stroke-width="1.5" stroke-opacity="0.55"/><text x="76" y="${ky + 22}" class="small">Monitoring well (${mon.features.length}): ground to its latest reading, 2013–21</text>
      <line x1="60" x2="60" y1="${ky + 50}" y2="${ky + 66}" stroke="#000" stroke-width="4"/><line x1="60" x2="60" y1="${ky + 66}" y2="${ky + 80}" stroke="#000" stroke-width="4" stroke-dasharray="6 5"/>
      <text x="76" y="${ky + 72}" class="small">Long-record well (${long.features.length}): solid to its first reading (1985–2001), dashed to its latest (2010–23)</text>
      <text x="60" y="1022" class="small grey">Source: CGWB monitoring wells via India Data Portal; pre-monsoon depth to water below ground. Belt median = 3-year rolling median across wells (1985: ${t85.n} wells; 2023: ${t23.n}).</text>
      <text x="60" y="1046" class="small grey">The well set changes between years. Horizontal position = longitude only, so wells north and south of each other overlap (e.g. the two Barnala town wells).</text>`;
document.getElementById("s").innerHTML = h;
document.title = "Soil section";
</script>
</body>
</html>
